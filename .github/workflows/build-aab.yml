name: Build Android app bundle

# Builds the signed store version (app-release.aab) for Google Play, with the
# upload key kept in the repository's secrets (Settings -> Secrets and variables
# -> Actions). Run it from the Actions tab ("Run workflow"); the .aab is under
# the run's Artifacts. Each run raises versionCode by one (the run number), so
# every upload is accepted, unless you give one yourself.
#
# Secrets it reads (any of these names works):
#   the upload key, base64-encoded:  ANDROID_KEYSTORE_BASE64, KEYSTORE_BASE64, UPLOAD_KEYSTORE_BASE64, KEYSTORE
#   its password:                   ANDROID_KEYSTORE_PASSWORD, KEYSTORE_PASSWORD, STORE_PASSWORD
#   the key alias (default upload): ANDROID_KEY_ALIAS, KEY_ALIAS
#   the key password (default: the keystore password): ANDROID_KEY_PASSWORD, KEY_PASSWORD
# To make the base64 text on your computer: base64 -w0 upload-key.jks

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'versionCode (empty: this run number)'
        required: false
      version_name:
        description: 'versionName (empty: 1.0.<run number>)'
        required: false

permissions:
  contents: read

jobs:
  aab:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 || secrets.UPLOAD_KEYSTORE_BASE64 || secrets.KEYSTORE }}
      STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD || secrets.STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || secrets.KEY_ALIAS || 'upload' }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD || secrets.STORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the signing secrets are there
        run: |
          # Only says which are set, never their values.
          [ -n "$KEYSTORE_B64" ] && echo "upload key: found" || echo "upload key: MISSING"
          [ -n "$STORE_PASSWORD" ] && echo "keystore password: found" || echo "keystore password: MISSING"
          echo "key alias: $([ "$KEY_ALIAS" = upload ] && echo 'upload (default or set)' || echo 'set')"
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASSWORD" ]; then
            echo "::error::Add the upload key (base64) and its password as repository secrets; the accepted names are listed at the top of this workflow."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Android SDK 36
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Install
        working-directory: app
        run: npm ci

      - name: Upload key
        run: |
          echo "$KEYSTORE_B64" | tr -d ' \n\r' | base64 -d > "$RUNNER_TEMP/upload-key.jks"
          keytool -list -keystore "$RUNNER_TEMP/upload-key.jks" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null \
            || { echo "::error::The key couldn't be opened: check the base64 text, the password and the alias."; exit 1; }
          cat > app/android/keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/upload-key.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Version
        env:
          CODE: ${{ inputs.version_code || github.run_number }}
          NAME: ${{ inputs.version_name || format('1.0.{0}', github.run_number) }}
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode $CODE/; s/versionName \"[^\"]*\"/versionName \"$NAME\"/" app/android/app/build.gradle
          grep -E "versionCode|versionName" app/android/app/build.gradle

      - name: Build the bundle
        working-directory: app
        run: npm run aab

      - name: Check it's signed with the upload key
        run: |
          AAB=app/android/app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify "$AAB" | grep -q "jar verified" || { echo "::error::The bundle isn't signed."; exit 1; }
          keytool -printcert -jarfile "$AAB" | grep -E "Owner|SHA256:" | head -2
          ls -l "$AAB"

      - uses: actions/upload-artifact@v4
        with:
          name: merge-farmstead-aab-${{ inputs.version_code || github.run_number }}
          path: app/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload-key.jks" app/android/keystore.properties

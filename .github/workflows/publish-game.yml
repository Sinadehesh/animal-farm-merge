name: Publish game

# Copies the game to the gh-pages branch so GitHub Pages can host it.
# One-time setup: Settings -> Pages -> Source: "Deploy from a branch",
# Branch: gh-pages, folder: / (root). The game is then at
# https://<owner>.github.io/<repo>/

on:
  push:
    branches: [main, claude/serene-curie-3qote4]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-game
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect the game files
        run: |
          mkdir site
          cp index.html game.js assets.js manifest.json site/
          cp -r assets site/
          touch site/.nojekyll

      - name: Push to gh-pages
        working-directory: site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Publish game from ${GITHUB_SHA}"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 800" width="450" height="800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <pattern id="planks" width="50" height="800" patternUnits="userSpaceOnUse">
      <rect width="50" height="800" fill="#ecc994"/>
      <path d="M49 0 V800" stroke="#d2a86e" stroke-width="3"/>
      <circle cx="12" cy="120" r="2" fill="#c9995c"/><circle cx="34" cy="420" r="2" fill="#c9995c"/>
    </pattern>
    <pattern id="floor" width="450" height="40" patternUnits="userSpaceOnUse">
      <rect width="450" height="40" fill="#b9804c"/>
      <path d="M0 39 H450 M90 0 V40 M260 0 V40" stroke="#94613a" stroke-width="3"/>
    </pattern>
  </defs>
  <rect width="450" height="800" fill="url(#planks)"/>
  <!-- window and sign -->
  <g stroke="#4a3426" stroke-width="5" stroke-linejoin="round">
    <rect x="140" y="20" width="170" height="44" rx="10" fill="#fff8e7"/>
    <text x="225" y="52" font-family="Arial Rounded MT Bold, Nunito, Segoe UI, sans-serif" font-size="26" font-weight="900" fill="#4a3426" stroke="none" text-anchor="middle">MARKET</text>
    <path d="M160 20 V2 M290 20 V2" stroke-width="3"/>
  </g>
  <!-- shelves: deeds sit on these boards -->
  <g stroke="#4a3426" stroke-width="5" stroke-linejoin="round">
    <rect x="16" y="226" width="418" height="16" rx="3" fill="#a5683d"/>
    <path d="M40 242 L52 262 H64 V242 M386 242 V262 H398 L410 242" fill="#8f5631" stroke-width="4"/>
    <rect x="16" y="378" width="418" height="16" rx="3" fill="#a5683d"/>
    <path d="M40 394 L52 414 H64 V394 M386 394 V414 H398 L410 394" fill="#8f5631" stroke-width="4"/>
  </g>
  <!-- wainscot and floor -->
  <rect y="470" width="450" height="160" fill="#c9915a"/>
  <path d="M0 470 H450" stroke="#4a3426" stroke-width="5"/>
  <path d="M0 482 H450" stroke="#a5683d" stroke-width="4"/>
  <rect y="630" width="450" height="170" fill="url(#floor)"/>
  <path d="M0 630 H450" stroke="#4a3426" stroke-width="5"/>
  <!-- potted plant and sacks -->
  <g stroke="#4a3426" stroke-width="4" stroke-linejoin="round">
    <path d="M20 470 L26 430 H66 L72 470 Z" fill="#d9734a"/>
    <circle cx="46" cy="410" r="24" fill="#4caf50"/>
    <path d="M374 470 Q370 430 384 420 H420 Q434 430 430 470 Z" fill="#e8dcc0"/>
    <path d="M384 420 Q402 410 420 420" fill="none"/>
  </g>
</svg>
